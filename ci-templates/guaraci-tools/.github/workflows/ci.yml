name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Syntax check (node --check)
        run: |
          find packages -name node_modules -prune -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | xargs -0 -r -n1 node --check

      - name: Tests (grammar snapshots)
        run: npm test --workspaces --if-present

      - name: Package VSIX
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce package --no-dependencies --out guaraci.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: guaraci-vsix
          path: packages/vscode/guaraci.vsix
          if-no-files-found: error
