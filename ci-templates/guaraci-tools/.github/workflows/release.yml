name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Package VSIX
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce package --no-dependencies --out "guaraci-${GITHUB_REF_NAME}.vsix"

      - name: Attach VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/vscode/*.vsix

      # Publish steps are skipped until the secrets are configured.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "guaraci-${GITHUB_REF_NAME}.vsix" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: packages/vscode
        run: npx --yes ovsx publish "guaraci-${GITHUB_REF_NAME}.vsix" -p "$OVSX_PAT"
