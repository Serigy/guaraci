name: Release on Tag Push

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v*.*.*-*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ github.actor != 'github-actions[bot]' }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se release ja existe
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.GITHUB_REF_NAME
              });
              core.setOutput('exists', 'true');
            } catch (err) {
              if (err.status === 404) {
                core.setOutput('exists', 'false');
                return;
              }
              throw err;
            }

      - uses: leafo/gh-actions-lua@v11
        if: ${{ steps.existing.outputs.exists != 'true' }}
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
        if: ${{ steps.existing.outputs.exists != 'true' }}

      # Same derivation as release.yml, so manual tags yield identical artifacts.
      - name: Derivar, validar e empacotar rock
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: ./.github/actions/derive-rock
        with:
          tag: ${{ github.ref_name }}
          pack: "true"

      - name: Gerar pacotes da release
        if: ${{ steps.existing.outputs.exists != 'true' }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=zip --output "dist/guaraci-${TAG}.zip" "$TAG"
          git archive --format=tar.gz --output "dist/guaraci-${TAG}.tar.gz" "$TAG"

      - name: Criar GitHub Release
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.rockspec
            dist/*.src.rock

      - name: Release ja existente
        if: ${{ steps.existing.outputs.exists == 'true' }}
        run: echo "Release para a tag ${GITHUB_REF_NAME} ja existe. Fluxo automatico ignorado sem erro."
