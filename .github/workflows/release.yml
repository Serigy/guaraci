name: Release and Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao da release (ex: v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pre-release"
        required: false
        default: false
        type: boolean
      generate_release_notes:
        description: "Gerar release notes automaticamente"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-manual-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag-name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validar versao e normalizar tag
        id: tag
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          NORMALIZED="${RAW_VERSION#v}"
          if [[ ! "$NORMALIZED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Versao invalida: $RAW_VERSION"
            echo "Use formato vX.Y.Z, X.Y.Z, vX.Y.Z-alpha.N ou X.Y.Z-alpha.N"
            exit 1
          fi
          echo "tag=v$NORMALIZED" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag-name
    uses: ./.github/workflows/ci.yml

  validate:
    name: validate rockspec
    needs: [tag-name, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - uses: ./.github/actions/derive-rock
        with:
          tag: ${{ needs.tag-name.outputs.tag }}

  release:
    needs: [tag-name, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se release ja existe
        id: existing_release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.tag-name.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG
              });
              core.setOutput('exists', 'true');
            } catch (err) {
              if (err.status === 404) {
                core.setOutput('exists', 'false');
                return;
              }
              throw err;
            }

      # The tag is only created after CI and rockspec validation passed.
      - name: Criar e publicar tag
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.tag-name.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG ja existe."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - uses: leafo/gh-actions-lua@v11
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
        if: ${{ steps.existing_release.outputs.exists != 'true' }}

      - name: Derivar, validar e empacotar rock
        id: rock
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        uses: ./.github/actions/derive-rock
        with:
          tag: ${{ needs.tag-name.outputs.tag }}
          pack: "true"

      - name: Gerar pacotes da release
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.tag-name.outputs.tag }}
        run: |
          git archive --format=zip --output "dist/guaraci-${TAG}.zip" "$TAG"
          git archive --format=tar.gz --output "dist/guaraci-${TAG}.tar.gz" "$TAG"

      - name: Criar GitHub Release
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-name.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate_release_notes }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.rockspec
            dist/*.src.rock

      - name: Aviso sobre publicacao no LuaRocks
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.tag-name.outputs.tag }}
        run: |
          echo "::notice::Release $TAG criada. Para publicar (ou re-publicar) o pacote no LuaRocks, rode o workflow 'LuaRocks Publish': gh workflow run luarocks-publish.yml -f tag=$TAG -f dry_run=false"

      - name: Commitar rockspec versionado em rockspecs/
        if: ${{ steps.existing_release.outputs.exists != 'true' }}
        shell: bash
        env:
          ROCKSPEC: ${{ steps.rock.outputs.rockspec }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p rockspecs
          cp "$ROCKSPEC" rockspecs/
          if git diff --quiet -- rockspecs && [ -z "$(git ls-files --others --exclude-standard rockspecs)" ]; then
            echo "rockspecs/ sem alteracoes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rockspecs
          git commit -m "chore: add $(basename "$ROCKSPEC") [skip ci]"
          git push origin main

      - name: Release ja existente
        if: ${{ steps.existing_release.outputs.exists == 'true' }}
        run: echo "Release para a tag ${{ needs.tag-name.outputs.tag }} ja existe. Encerrando sem erro."
